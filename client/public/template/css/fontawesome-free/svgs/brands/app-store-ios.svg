.iep-group{display:flex;flex-direction:column;gap:var(--spacing-40)}.iep-list{display:flex;flex-direction:column;gap:var(--spacing-20)}.iep-opt{display:flex;align-items:center;gap:var(--spacing-40);width:100%;padding:var(--spacing-20) var(--spacing-40);background:none;border:1px solid transparent;border-radius:var(--radius-medium);cursor:pointer;text-align:start;font-family:var(--font-family-base);color:var(--fg-neutral-1-rest);box-sizing:border-box;transition:background var(--anim-hover),border-color var(--anim-hover)}.iep-opt:hover:not(.iep-opt--selected){background:var(--bg-subtle-inverted-hover)}.iep-opt:active:not(.iep-opt--selected){background:var(--bg-subtle-inverted-pressed)}.iep-opt:focus-visible{outline:2px solid var(--stroke-focus-2);outline-offset:1px}.iep-opt--selected{border-color:var(--stroke-brand-1-rest);background:var(--bg-neutral-5-rest)}.iep-dot{position:relative;flex:0 0 a