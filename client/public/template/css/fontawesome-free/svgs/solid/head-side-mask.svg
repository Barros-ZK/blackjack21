D55C \uC724\uACFD\uC120, \uC0AC\uC2E4\uC801\uC778 \uC9C8\uAC10(\uC608: \uD53C\uBD80 \uBAA8\uACF5, \uC9C1\uBB3C \uC12C\uC720, \uB610\uB837\uD55C \uAC74\uCD95 \uC120)\uC744 \uD3EC\uD568\uD574\uC11C \uC7A5\uBA74\uC744 \uC7AC\uAD6C\uC131\uD574 \uC918. \uADF9\uB3C4\uB85C \uC0AC\uC2E4\uC801\uC778 \uD3EC\uD1A0\uB9AC\uC5BC\uB9AC\uC998\uACFC \uC790\uC5F0\uC2A4\uB7EC\uC6B4 \uC870\uBA85\uC774 \uC788\uAC8C \uAD6C\uC131\uD574 \uC918.","increaseResolution":"\uD574\uC0C1\uB3C4\uB97C \uB192\uC774\uACE0 \uD750\uB9BC\uACFC \uB178\uC774\uC988\uB97C \uC904\uC5EC \uC918. \uC0AC\uC2E4\uC801\uC778 \uC9C8\uAC10\uC740 \uC720\uC9C0\uD574 \uC918. \uD574\uBD80\uD559\uC801 \uC694\uC18C\uB294 \uBC14\uAFB8\uC9C0 \uB9D0