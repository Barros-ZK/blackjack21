788\uC73C\uBA74 \uC5BC\uAD74\uACFC \uD2B9\uC9D5\uC740 \uC815\uD655\uD558\uAC8C \uADF8\uB300\uB85C \uC720\uC9C0\uD574 \uC918.","removeObject":"\uC120\uD0DD\uD55C \uAC1C\uCCB4\uB97C \uC81C\uAC70\uD558\uACE0 \uD45C\uBA74\uC744 \uC790\uC5F0\uC2A4\uB7FD\uAC8C \uBCF5\uC6D0\uD574 \uC918.","restorePhoto":"\uAE01\uD798\uC744 \uC81C\uAC70\uD558\uACE0, \uC0C9 \uBC14\uB7A8\uC744 \uBCF4\uC815\uD558\uACE0, \uB204\uB807\uAC8C \uBCC0\uD55C \uBD80\uBD84\uC744 \uC218\uC815\uD574 \uC774 \uC624\uB798\uB418\uC5C8\uAC70\uB098 \uC190\uC0C1\uB41C \uC0AC\uC9C4\uC744 \uBCF5\uC6D0\uD574 \uC918. \uC6D0\uBCF8\uC758 \uB290\uB08C\uC740 \uC0B4\uB9AC\uBA74\uC11C \uAE68\uB057\uD558\uACE0 \uC798 \uBCF4\uC874\uB41C \uC0AC\uC9C4\uCC98\uB7FC \uBCF4\uC774\uAC8C \uB9CC\uB4E4\uC5B4 \uC918. \uC0AC\uB78C\uC774 \uC788\uB2E4\uBA74 \uC5BC\uAD74\uC740 \uC815\uD655\uD788 \uC720\uC9C0\uD574 \uC918.","retouchSkin":"\uC774 \uC0AC\uC9C4 \uC18D \uC0AC\uB78C\uC758 \uD53C\uBD80\uB97C \uBD80\uB4DC\uB7FD\uAC8C \uBCF4\uC815\uD574 \uC918. \uC77C\uC2DC\uC801\uC778 \uC7A1\uD2F0, \uC810, \uACE0\uB974\uC9C0 \uC54A\uC740 \uC791\uC740 \uD53C\uBD80\uACB0\uC74